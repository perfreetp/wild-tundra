<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>井下避灾路线相机运镜工具</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">井下避灾路线 · 相机运镜工具</div>
        <div class="engine-badge" id="engineBadge">引擎初始化中…</div>
        <div class="top-actions">
          <button id="btnExportJson" class="btn">导出 route.json</button>
          <button id="btnExportTrack" class="btn">导出轨迹文件</button>
        </div>
      </header>

      <main class="main">
        <aside class="sidebar">
          <section class="panel">
            <h2>路线管理</h2>
            <div class="route-list" id="routeList"></div>
            <div class="route-name-row">
              <label>路线名称</label>
              <input id="routeNameInput" type="text" maxlength="20" />
            </div>
          </section>

          <section class="panel">
            <h2>路径编辑</h2>
            <div class="tool-row">
              <button class="btn tool-btn active" data-tool="add">打点</button>
              <button class="btn tool-btn" data-tool="select">选择</button>
              <button class="btn tool-btn" data-tool="gaze">注视点</button>
            </div>
            <p class="hint" id="toolHint">打点模式:点击巷道节点球,按顺序追加关键点</p>
            <div class="kp-list" id="kpList"></div>
            <div class="kp-editor" id="kpEditor">
              <p class="kp-editor-empty">未选择关键点</p>
            </div>
            <div class="row-actions">
              <button class="btn small" id="btnAutoTime">按速度档推算时间</button>
              <button class="btn small danger" id="btnClearRoute">清空路线</button>
            </div>
          </section>

          <section class="panel">
            <h2>运镜参数</h2>
            <div class="slider-row">
              <label>头部微摆 <b id="swayVal">1.0°</b></label>
              <input id="swaySlider" type="range" min="0" max="2" step="0.1" value="1" />
            </div>
            <div class="slider-row">
              <label>终点雾量 <b id="fogVal">60%</b></label>
              <input id="fogSlider" type="range" min="0" max="60" step="1" value="60" />
            </div>
            <div class="slider-row">
              <label>圆角半径 <b id="filletVal">2.0m</b></label>
              <input id="filletSlider" type="range" min="0" max="4" step="0.1" value="2" />
            </div>
          </section>
        </aside>

        <section class="viewport">
          <canvas id="renderCanvas"></canvas>
          <div class="viewport-hud" id="hud"></div>
        </section>
      </main>

      <footer class="bottombar">
        <div class="transport">
          <button class="btn" id="btnPlay">▶ 播放</button>
          <button class="btn" id="btnStop">■ 停止</button>
          <div class="rate-group" id="rateGroup">
            <button class="btn rate-btn" data-rate="0.5">0.5x</button>
            <button class="btn rate-btn active" data-rate="1">1x</button>
            <button class="btn rate-btn" data-rate="2">2x</button>
          </div>
          <div class="time-readout" id="timeReadout">0.0 / 0.0 s</div>
        </div>
        <div class="timeline-wrap" id="timeline"></div>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
